name: Android CI/CD

on:
  push:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择编译类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Calculate Version Info
      id: version_info
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        VERSION_CODE=$((COMMIT_COUNT))
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        
        BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        VERSION_NAME="${BRANCH_NAME}-${COMMIT_SHORT}"
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        
        echo "Version Code: $VERSION_CODE"
        echo "Version Name: $VERSION_NAME"

    - name: Modify Gradle Build File
      run: |
        GRADLE_FILE="app/build.gradle.kts"
        
        sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${{ steps.version_info.outputs.version_code }}/g" "$GRADLE_FILE"
        
        sed -i -E "s/versionName[[:space:]]*=[[:space:]]*['\"][^'\"]*['\"]/versionName = \"${{ steps.version_info.outputs.version_name }}\"/g" "$GRADLE_FILE"
        
        echo "Modified gradle file:"
        grep -E "versionCode|versionName" "$GRADLE_FILE"
          
    - name: Build with Gradle
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "both" ]; then
          ./gradlew assembleDebug assembleRelease
        elif [ "${{ github.event.inputs.build_type }}" == "release" ]; then
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.event.inputs.build_type || 'debug' }}
        path: ${{ github.workspace }}/app/build/outputs/apk/**/*.apk